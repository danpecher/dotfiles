set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

##### Quality of life
set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off


set -g allow-rename off

##### Better keybindings
unbind '"'
unbind %
unbind s
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind w choose-tree -Zs
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
bind -n C-n next-window
bind -n C-p previous-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# setw -g window-status-format " #I:#W(#{pane_current_command}) "
# setw -g window-status-current-format " #I:#W(#{pane_current_command}) "

##### Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'eduwass/tmux-palette'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @tmux-gruvbox 'dark256' # 'dark' # or 'dark256', 'light', 'light256'

# Load the theme directly. setup_tmux installs this plugin at a pinned commit;
# making it explicit avoids depending on TPM discovery during server startup.
if-shell '[ -x ~/.config/tmux/plugins/tmux-gruvbox/gruvbox-tpm.tmux ]' \
  'run-shell ~/.config/tmux/plugins/tmux-gruvbox/gruvbox-tpm.tmux'

# set -g @plugin 'catppuccin/tmux#v2.3.0'
# set -g @catppuccin_window_text " #W #{b:pane_current_path}"
# set -g @catppuccin_window_current_text " #W #{b:pane_current_path}"

bind-key T run-shell "~/.config/tmux/plugins/tmux-palette/bin/tmux-palette.sh tools"

if-shell '[ -f ~/.config/tmux/plugins/tpm/tpm ]' 'run ~/.config/tmux/plugins/tpm/tpm'
